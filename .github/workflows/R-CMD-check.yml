name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    uses: gojiplus/r-canon/.github/workflows/reusable-check.yml@v2
    with:
      # The vignette renders to PDF; rmarkdown fetches the LaTeX packages it needs.
      tinytex: true
